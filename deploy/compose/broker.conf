# TaS MQTT broker configuration for the composed deployment (issue #45).
#
# This is the broker policy for the three-service composition defined by
# /docker-compose.yml, where the broker runs as its own service and its
# clients — the TaS application and Node-RED — are separate containers. It
# follows the same principles as the repository's default mosquitto.conf
# (issue #46): the access policy is stated in the repository instead of
# inherited from a distribution default.
#
# The one difference is forced by the split: a loopback-bound listener can
# only be reached from inside its own container, so the anonymous internal
# listener that used to serve co-located processes on 127.0.0.1:1884 is bound
# to the compose network instead (0.0.0.0). It is NOT published to the host —
# only containers attached to this composition's network can reach it, and
# external clients still have to use the authenticated listener.
#
# Access policy:
#   - Port 1883 (the published listener) requires authentication:
#     anonymous access is disabled and credentials are checked against the
#     password file below. The password file is NOT part of this repository
#     or of any image — it lives in a volume seeded at first start by the
#     composition's broker-init service (override MOSQUITTO_USERNAME /
#     MOSQUITTO_PASSWORD to replace the quick-start credentials, see
#     README.md).
#   - Port 1884 is the internal listener for services inside the
#     composition (TaS simulations, Node-RED flows). It allows anonymous
#     access but is never published beyond the compose network.
#
# Syntax note: as in mosquitto.conf, allow_anonymous is per-listener with
# the listener_-prefixed form; password_file is global, which is equivalent
# here because a listener that allows anonymous access never consults
# credentials at all.
#
# Persistence: retained messages and queue state survive restarts in the
# broker-data volume.

listener 1883 0.0.0.0
listener_allow_anonymous false
password_file /run/mosquitto/passwd

listener 1884 0.0.0.0
listener_allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
