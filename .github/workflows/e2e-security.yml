name: E2E Security Regression Suite

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http-suite:
    name: E2E over HTTP (containment, sanitisation, CORS, limits, legit flows)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Run on the runtime the repository pins (.nvmrc), so the gate
          # exercises the same Node major as a deployed instance.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The compiled client bundle is no longer committed (issue #42), so build
      # it before running the suite — the security-headers test reads
      # src/public/index.html for its CSP inline-script assertions.
      - name: Build the dashboard client
        run: cd src/client && npm install && npm run build

      # Serialised: each suite drives its own real instance, and while those
      # now run against throwaway storage roots (issue #58), some in-process
      # suites (test/http-status.test.js) still exercise the checkout's own
      # data files, so parallel runs could race on them. `npm test` is
      # `node --test-concurrency=1 --test "test/**/*.test.js"`, which keeps
      # that serialisation while also gating the unit-level regression guards
      # that naming the e2e files individually left unable to fail a PR.
      # The container image assertion is part of the glob but skips itself here:
      # its runtime half is guarded on TAS_IMAGE, which only the job below sets.
      - name: Run the full test suite
        run: npm test

  dependency-audit:
    name: Production dependency advisories (high/critical gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Issue #71: `npm audit` never ran in CI, so a new high/critical advisory
      # in the production manifest shipped silently. The gate fails on any
      # unlisted high/critical advisory and on stale allowlist entries; every
      # exception lives in .github/audit-allowlist.json with a written reason
      # naming the issue that owns its fix.
      - name: Gate on production dependency advisories
        run: node scripts/audit-gate.js

  container:
    name: Container image runs as non-root
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the TaS container image
        run: docker build -t montimage/tas:e2e .

      # Issue #45: the composition is a shipped artifact — validate its
      # schema, variable interpolation and health-check wiring on every PR.
      - name: Validate the service composition
        run: docker compose config -q

      - name: Assert the built image runs as a non-root user
        run: node --test test/e2e/container-nonroot.test.js
        env:
          TAS_IMAGE: montimage/tas:e2e

  lint:
    name: Lint (eslint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Issue #24: the suite gate exercised behaviour, but nothing ran static
      # analysis on a pull request. A dedicated job rather than a step of the
      # suite job, so lint reports independently of the database-backed suites.
      - name: Run eslint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # Issue #92: coverage gate — enforce a minimum line-coverage threshold on
  # the infra-free test suites (the ones that run without a live MongoDB).
  # ---------------------------------------------------------------------------
  coverage:
    name: Test coverage gate (≥ 60 % line coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build the dashboard client so that routes which reference it do not
      # fail at boot time (the same prerequisite the other jobs already run).
      - name: Build the dashboard client
        run: cd src/client && npm install && npm run build

      # Run the infra-free suites under `--experimental-test-coverage` and
      # assert that the overall line coverage meets the threshold.  The
      # `--test` glob is narrowed to the suites that do not need a live
      # database; the DB-backed suites are exercised in the http-suite job
      # and their coverage is reported separately.
      - name: Run coverage on infra-free suites
        run: |
          node --test-concurrency=1 \
            --experimental-test-coverage \
            --test \
              "test/events-route.test.js" \
              "test/reports-route.test.js" \
              "test/simulation-lifecycle.test.js" \
              "test/data-recorder-lifecycle.test.js" \
              "test/health-route.test.js" \
              "test/model-persistence.test.js" \
              "test/data-storage-save.test.js" \
              "test/simulation-stats.test.js" \
              "test/reports-pagination.test.js" \
              "test/data-storage.test.js" \
              "test/auth.test.js" \
              "test/auth-primitives.test.js" \
              "test/input-validation.test.js" \
              "test/core-utils.test.js" \
              "test/env-config.test.js" \
              "test/config.test.js" \
              "test/ci-gate.test.js" \
              "test/package-manifest.test.js" \
              "test/generator.test.js" \
              "test/scoring-determinism.test.js" \
              "test/evaluation.test.js" \
              "test/sensor-data-sources.test.js" \
              "test/rate-limit.test.js" \
              "test/body-limit.test.js" \
              "test/security-headers.test.js" \
              "test/routes-security.test.js" \
              "test/openapi.test.js" \
              "test/http-status.test.js" \
              "test/request-correlation.test.js" \
              "test/logger.test.js" \
              "test/mongoose-migration.test.js" \
              "test/db-connector-credential-redaction.test.js" \
              "test/db-connector-recovery.test.js" \
              "test/runtime-state-registry.test.js" \
              "test/runtime.test.js" \
              "test/evaluation-linear.test.js" \
              "test/data-storage-batching.test.js" \
              "test/log-read-bounds.test.js" \
              "test/log-router-kind.test.js" \
              "test/cors.test.js" \
              "test/path-safety.test.js" \
              "test/auth-csrf.test.js" \
              "test/auth-logging.test.js" \
              "test/auth-proxy.test.js" \
              "test/enact-db.test.js" \
              "test/dependency-audit.test.js" \
              "test/release-workflow.test.js" \
              "test/deployment-docs.test.js" \
              "test/dockerfile.test.js" \
              "test/graceful-shutdown.test.js" \
              "test/mqtt-endpoint.test.js" \
              "test/env-not-tracked.test.js" \
              "test/config-reload.test.js" \
              "test/artifact-store.test.js" \
              "test/audit-gate.test.js" \
              "test/model-collision.test.js" \
              "test/simulation-scoring-bound.test.js" \
              "test/thing-hotpath.test.js" \
              "test/update-not-found.test.js" \
              "test/core-utils.test.js" \
              "test/throughput-baseline.test.js" \
              "test/server-smoke.test.js" \
              2>&1 | tee /tmp/coverage-run.log

      # Parse the coverage summary from the Node.js test runner output and
      # fail if the overall line coverage is below 60 %.
      - name: Enforce coverage threshold
        run: |
          # The Node test runner prints a summary line like:
          #   ℹ all files                 |  62.34 |    65.44 |   42.30 |
          # The first numeric column after the pipe is line coverage.
          COV=$(grep 'ℹ all files' /tmp/coverage-run.log | grep -oP '\|\s+\K[0-9.]+' | head -1)
          if [ -z "$COV" ]; then
            echo "::error::Could not parse coverage from test output" >&2
            exit 1
          fi
          echo "Line coverage: ${COV}%"
          THRESHOLD=60
          PASS=$(echo "$COV >= $THRESHOLD" | bc -l 2>/dev/null || python3 -c "import sys; sys.exit(0 if float('$COV') >= $THRESHOLD else 1)")
          if [ "$PASS" = "1" ] || [ "$PASS" = "True" ]; then
            echo "Coverage ${COV}% meets the ${THRESHOLD}% threshold."
          else
            echo "::error::Coverage ${COV}% is below the ${THRESHOLD}% threshold"
            exit 1
          fi
