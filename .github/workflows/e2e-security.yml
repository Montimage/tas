name: E2E Security Regression Suite

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http-suite:
    name: E2E over HTTP (containment, sanitisation, CORS, limits, legit flows)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Match the runtime the shipped container image uses, so the gate
          # exercises the same Node major as a deployed instance.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Serialised: each file spawns its own real instance and the suites share
      # the on-disk storage root, so running them in parallel makes the
      # directory snapshots race and the instances contend for the same port.
      - name: Run the end-to-end security suite over HTTP
        run: >-
          node --test-concurrency=1 --test
          test/e2e/security-suite.test.js test/e2e/limits.test.js

  container:
    name: Container image runs as non-root
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the TaS container image
        run: docker build -t montimage/tas:e2e .

      - name: Assert the built image runs as a non-root user
        run: node --test test/e2e/container-nonroot.test.js
        env:
          TAS_IMAGE: montimage/tas:e2e
